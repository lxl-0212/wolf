<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>狼人殺助手 - 鎖定標記版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --wolf: #ef4444;
            --good: #3b82f6;
            --text: #f1f5f9;
        }

        body {
            font-family: 'PingFang TC', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: var(--text);
            margin: 0; padding: 10px;
            display: flex; justify-content: center;
            min-height: 100vh;
        }

        .app-card { background: var(--card-bg); backdrop-filter: blur(10px); width: 100%; max-width: 500px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); padding: 24px; margin: auto; }
        
        /* 座位區樣式 */
        .seat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
        .seat-btn { 
            background: #3d3434; border: none; border-radius: 12px; height: 60px; 
            color: white; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 0 #222;
        }
        .seat-btn.my-choice { background: #555; border: 2px solid #fff; box-shadow: 0 0 15px var(--good); }
        .seat-btn:disabled:not(.my-choice) { opacity: 0.2; filter: grayscale(1); }

        /* 看牌卡片樣式 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .identity-card { background: #e5e7eb; width: 85%; max-width: 380px; border-radius: 20px; padding: 35px; color: #333; text-align: center; }
        .role-title { font-size: 2.5rem; font-weight: 900; color: #1f2937; margin: 10px 0; }
        
        /* 主持人名單樣式 */
        .host-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .death-btn { background: #444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .death-btn.dead { background: var(--wolf); color: #fff; }
        .is-dead-text { text-decoration: line-through; color: #666 !important; }

        .share-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #e63946; color: white; padding: 16px 0; text-align: center; font-weight: bold; cursor: pointer; z-index: 500; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-card">
    <div id="setup-ui">
        <h3 style="text-align:center">🛠️ 遊戲配置</h3>
        <div style="display:flex; gap:10px; margin-bottom: 15px;">
            <div style="flex:1;">
                <div style="text-align:center; color:var(--wolf); font-size:12px; font-weight:bold;">🐺 狼人陣營</div>
                <div id="wolf-list" style="background:rgba(0,0,0,0.3); border-radius:12px; padding:8px;"></div>
            </div>
            <div style="flex:1;">
                <div style="text-align:center; color:var(--good); font-size:12px; font-weight:bold;">😇 好人陣營</div>
                <div id="good-list" style="background:rgba(0,0,0,0.3); border-radius:12px; padding:8px;"></div>
            </div>
        </div>
        <button onclick="dealCards()" style="width:100%; padding:15px; background:var(--good); border:none; border-radius:12px; color:white; font-weight:bold;">🎲 生成座位與發牌</button>
    </div>

    <div id="game-ui" class="hidden">
        <div id="seat-grid" class="seat-grid"></div>
        <button style="width:100%; margin-top:30px; padding:15px; background:#111; color:#888; border:1px solid #333; border-radius:12px;" onclick="selectHostMode()">🔨 上帝全視角 (主持人)</button>
    </div>
</div>

<div id="share-trigger" class="share-bar hidden" onclick="openShareModal()">分享連結 / 掃碼</div>

<div id="reveal-screen" class="overlay hidden">
    <div class="identity-card">
        <div id="show-role" class="role-title"></div>
        <div id="camp-tag" style="display:inline-block; padding:4px 15px; border-radius:20px; font-size:12px; color:#fff; margin-bottom:20px;"></div>
        <div id="show-skill" style="text-align:left; font-size:0.9rem; line-height:1.6; color:#4b5563; border-top:1px solid #ccc; padding-top:15px;"></div>
    </div>
    <button onclick="closeOverlay()" style="margin-top:40px; padding:12px 50px; border-radius:30px; border:1px solid #fff; background:none; color:#fff">我記住了</button>
</div>

<div id="host-screen" class="overlay hidden">
    <h3 style="color:#fff">🔨 上帝全視角</h3>
    <div id="host-content" style="width:90%; max-height:70vh; overflow-y:auto; background:rgba(255,255,255,0.05); border-radius:15px;"></div>
    <button onclick="closeOverlay()" style="margin-top:30px; padding:12px 50px; border-radius:30px; border:1px solid #666; background:none; color:#aaa">關閉</button>
</div>

<script>
// --- Firebase 設定 ---
const ROOM_ID = "302";
const firebaseConfig = { apiKey: "YOUR_API_KEY", databaseURL: "https://YOUR_PROJECT.firebaseio.com", projectId: "YOUR_PROJECT_ID" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const wolfRoles = [
    {n: "狼人", c: "WOLF", s: "▶ 夜晚與狼隊商量擊殺一名玩家。"},
    {n: "狼王", c: "WOLF", s: "▶ 出局後可開槍帶走一人。"},
    {n: "白狼王", c: "WOLF", s: "▶ 白天可自爆帶走一人。"},
    {n: "狼美人", c: "WOLF", s: "▶ 出局時魅惑對象殉情。"}
];
const goodRoles = [
    {n: "預言家", c: "GOOD", s: "▶ 每晚可以查驗一名玩家的陣營。"},
    {n: "女巫", c: "GOOD", s: "▶ 擁有一瓶解藥與毒藥。"},
    {n: "獵人", c: "GOOD", s: "▶ 出局後可開槍。被女巫毒死無技能。"},
    {n: "守衛", c: "GOOD", s: "▶ 每晚守護一人，不可連守。"},
    {n: "平民", c: "GOOD", s: "▶ 無技能，認真表水獲勝。"}
];

let counts = {};
let currentDeck = [];
let deaths = []; // 存儲死亡狀態
let userIdentity = localStorage.getItem('userIdentity');

function init() {
    [...wolfRoles, ...goodRoles].forEach(r => {
        counts[r.n] = 0;
        const target = r.c === "WOLF" ? 'wolf-list' : 'good-list';
        const div = document.createElement('div'); div.className = 'role-row';
        div.style = "display:flex; justify-content:space-between; margin:5px 0; font-size:12px";
        div.innerHTML = `<span>${r.n}</span><div><button onclick="upd('${r.n}',-1)">-</button><span id="v-${r.n}" style="margin:0 5px">0</span><button onclick="upd('${r.n}',1)">+</button></div>`;
        document.getElementById(target).appendChild(div);
    });
    listen();
}

function upd(n, d) { counts[n] = Math.max(0, counts[n] + d); document.getElementById('v-' + n).innerText = counts[n]; }

function dealCards() {
    let deck = [];
    for (let n in counts) { for (let i = 0; i < counts[n]; i++) deck.push(n); }
    if (deck.length === 0) return alert("請配置人數");
    deck.sort(() => Math.random() - 0.5);
    db.ref('w_rooms/' + ROOM_ID).set({ roles: deck, deaths: new Array(deck.length).fill(false), timestamp: Date.now() });
}

function listen() {
    db.ref('w_rooms/' + ROOM_ID).on('value', snap => {
        const data = snap.val(); if (!data) return;
        if (localStorage.getItem('lastTime') != data.timestamp) { localStorage.removeItem('userIdentity'); userIdentity = null; }
        localStorage.setItem('lastTime', data.timestamp);
        currentDeck = data.roles;
        deaths = data.deaths || [];
        document.getElementById('setup-ui').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        document.getElementById('share-trigger').classList.remove('hidden');
        renderUI();
    });
}

function renderUI() {
    const grid = document.getElementById('seat-grid');
    grid.innerHTML = "";
    currentDeck.forEach((r, i) => {
        const btn = document.createElement('button');
        btn.className = 'seat-btn';
        btn.innerText = `${i+1} 號玩家 點我看牌`;
        
        // --- 核心邏輯：鎖定機制 ---
        if (userIdentity === `P_${i}`) {
            btn.classList.add('my-choice'); // 自己選的號碼
            btn.onclick = () => showCard(r);
        } else if (userIdentity && userIdentity !== 'HOST') {
            btn.disabled = true; // 只要選過號碼，其他按鈕全部鎖死變灰
        } else if (userIdentity === 'HOST') {
            btn.disabled = true; // 主持人不能領牌
        } else {
            btn.onclick = () => {
                if(confirm(`確認鎖定 ${i+1} 號？鎖定後無法更改。`)) {
                    userIdentity=`P_${i}`;
                    localStorage.setItem('userIdentity', userIdentity);
                    renderUI();
                    showCard(r);
                }
            };
        }
        grid.appendChild(btn);
    });
}

// 主持人全視角名單
function openHostList() {
    const container = document.getElementById('host-content');
    container.innerHTML = currentDeck.map((r, i) => `
        <div class="host-item">
            <div style="${deaths[i] ? 'text-decoration:line-through; color:#666' : ''}">
                <span style="color:var(--good)">${i+1} 號</span>：<strong>${r}</strong>
            </div>
            <button class="death-btn ${deaths[i] ? 'dead' : ''}" onclick="toggleDeath(${i})">
                ${deaths[i] ? '💀 復活' : '💀 死亡'}
            </button>
        </div>
    `).join('');
    document.getElementById('host-screen').classList.remove('hidden');
}

function toggleDeath(index) {
    deaths[index] = !deaths[index];
    db.ref('w_rooms/' + ROOM_ID + '/deaths').set(deaths);
}

function showCard(name) {
    const roleData = [...wolfRoles, ...goodRoles].find(x => x.n === name);
    document.getElementById('show-role').innerText = name;
    const tag = document.getElementById('camp-tag');
    if (roleData.c === "WOLF") { tag.innerText = "🐺 狼人陣營-邪惡"; tag.style.background = "#ef4444"; }
    else { tag.innerText = "😇 好人陣營-神職"; tag.style.background = "#3b82f6"; }
    document.getElementById('show-skill').innerHTML = roleData.s;
    document.getElementById('reveal-screen').classList.remove('hidden');
}

function selectHostMode() { if(confirm("進入主持人模式？")) { userIdentity='HOST'; localStorage.setItem('userIdentity','HOST'); renderUI(); openHostList(); } }
function closeOverlay() { document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden')); }
init();
</script>
</body>
</html>
