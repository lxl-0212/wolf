<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>狼人殺助手 PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --wolf: #ff4757;
            --good: #2e86de;
            --accent: #ffa502;
            --card-bg: rgba(30, 41, 59, 0.9);
            --text: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", sans-serif;
            background: #0f172a;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            width: 90%;
            max-width: 450px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            margin: 20px auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 { text-align: center; margin-top: 0; margin-bottom: 25px; font-weight: 800; letter-spacing: 2px; }

        .camp-section { margin-bottom: 20px; width: 100%; }
        .camp-title {
            font-size: 14px;
            font-weight: bold;
            padding: 6px 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: inline-block;
        }
        .wolf-t { background: rgba(255, 71, 87, 0.2); color: var(--wolf); }
        .good-t { background: rgba(46, 134, 222, 0.2); color: var(--good); }

        /* 角色網格：確保對齊的核心 */
        .role-grid {
            display: grid;
            grid-template-columns: 1fr; /* 單欄排列更穩 */
            gap: 10px;
            width: 100%;
        }

        .role-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .role-name { font-size: 15px; font-weight: 500; }

        .counter-group { display: flex; align-items: center; gap: 12px; }

        .btn-count {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-count:active { background: rgba(255, 255, 255, 0.3); }

        .val { min-width: 20px; text-align: center; font-size: 16px; font-weight: bold; color: var(--accent); }

        .btn-main {
            width: 100%;
            padding: 18px;
            margin-top: 25px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #2e86de, #5f27cd);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .seat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .seat-btn {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            height: 60px;
            color: white;
            font-weight: bold;
        }
        .seat-btn.my-choice { background: #000; border: 2px solid var(--accent); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-card" id="setup-ui">
    <h2>🐺 狼人殺助手</h2>
    
    <div class="camp-section">
        <div class="camp-title wolf-t">狼人陣營</div>
        <div id="wolf-list" class="role-grid"></div>
    </div>

    <div class="camp-section">
        <div class="camp-title good-t">好人陣營</div>
        <div id="good-list" class="role-grid"></div>
    </div>

    <button class="btn-main" onclick="dealCards()">🎲 生成座位與發牌</button>
</div>

<div class="app-card hidden" id="game-ui">
    <h3 style="text-align:center">房間號：<span id="room-display" style="color:var(--accent)"></span></h3>
    <div id="seat-grid" class="seat-grid"></div>
    <button id="host-master-btn" style="width:100%; margin-top:30px; background:none; border:1px dashed #555; color:#888; padding:10px; border-radius:10px;" onclick="openHostList()">上帝全視角 (主持人)</button>
    <button onclick="location.href=location.pathname" style="width:100%; margin-top:20px; background:none; border:none; color:#666; font-size:12px;">返回首頁</button>
</div>

<script>
// --- Firebase 配置 (維持原樣) ---
const firebaseConfig = {
    apiKey: "AIzaSyAMkVtoNERRaeAQLkuq7F8-Z1Dnu-q4iCM",
    authDomain: "wolf-game-80e1d.firebaseapp.com",
    databaseURL: "https://wolf-game-80e1d-default-rtdb.asia-southeast1.firebasedatabase.app", 
    projectId: "wolf-game-80e1d",
    storageBucket: "wolf-game-80e1d.firebasestorage.app",
    messagingSenderId: "830974592836",
    appId: "1:830974592836:web:5f21f6a7fdd3743ed77911"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const allRoles = {
    "狼人": "WOLF", "狼兄": "WOLF", "狼弟": "WOLF", "狼王": "WOLF", "黑狼王": "WOLF",
    "白狼王": "WOLF", "狼美人": "WOLF", "機械狼": "WOLF", "惡靈騎士": "WOLF", "種狼": "WOLF",
    "預言家": "GOOD", "女巫": "GOOD", "獵人": "GOOD", "白痴": "GOOD", "守衛": "GOOD",
    "騎士": "GOOD", "魔術師": "GOOD", "攝夢人": "GOOD", "平民": "GOOD"
};

let counts = {};

// 初始化清單
function initList() {
    const wList = document.getElementById('wolf-list');
    const gList = document.getElementById('good-list');
    wList.innerHTML = "";
    gList.innerHTML = "";

    Object.keys(allRoles).forEach(name => {
        counts[name] = 0;
        const html = `
            <div class="role-item">
                <span class="role-name">${name}</span>
                <div class="counter-group">
                    <button class="btn-count" onclick="upd('${name}',-1)">-</button>
                    <span id="v-${name}" class="val">0</span>
                    <button class="btn-count" onclick="upd('${name}',1)">+</button>
                </div>
            </div>`;
        if (allRoles[name] === "WOLF") wList.innerHTML += html;
        else gList.innerHTML += html;
    });
}

function upd(name, delta) {
    counts[name] = Math.max(0, counts[name] + delta);
    document.getElementById('v-' + name).innerText = counts[name];
}

initList(); // 執行初始化

// 遊戲邏輯 (發牌/房號)
function dealCards() {
    let deck = [];
    for (let n in counts) { for (let i = 0; i < counts[n]; i++) deck.push(n); }
    if (deck.length === 0) return alert("請先選取角色！");
    deck.sort(() => Math.random() - 0.5);
    const newID = "R" + Math.floor(100000 + Math.random() * 900000);
    db.ref('w_rooms/' + newID).set({ roles: deck, deaths: new Array(deck.length).fill(false), timestamp: Date.now() })
      .then(() => { window.location.search = '?room=' + newID; });
}

// 進入房間邏輯
const urlParams = new URLSearchParams(window.location.search);
let ROOM_ID = urlParams.get('room');
if (ROOM_ID) {
    document.getElementById('setup-ui').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('room-display').innerText = ROOM_ID;
    db.ref('w_rooms/' + ROOM_ID).on('value', snap => {
        const data = snap.val();
        if (data) renderSeats(data.roles, data.deaths);
    });
}

function renderSeats(roles, deaths) {
    const grid = document.getElementById('seat-grid');
    grid.innerHTML = "";
    roles.forEach((r, i) => {
        const btn = document.createElement('button');
        btn.className = 'seat-btn';
        btn.innerText = `${i+1} 號`;
        if (deaths && deaths[i]) btn.style.opacity = "0.3";
        grid.appendChild(btn);
    });
}
</script>
</body>
</html>
