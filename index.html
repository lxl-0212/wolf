<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>狼人殺助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --wolf: #ef4444; --good: #3b82f6; --text: #f1f5f9; --btn-bg: #2d3748; }
        body { font-family: 'PingFang TC', sans-serif; background: radial-gradient(circle at top, #1e293b, #0f172a); color: var(--text); margin: 0; padding: 10px; min-height: 100vh; display: flex; align-items: center; }
        .app-card { background: var(--card-bg); backdrop-filter: blur(10px); width: 100%; max-width: 500px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); padding: 24px; margin: auto; }
        
        .setup-container { display: flex; gap: 15px; margin-top: 20px; }
        .camp-column { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .camp-title { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        
        /* 角色欄位樣式修正 */
        .role-card { background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .role-name { font-size: 13px; }
        .counter-group { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 2px 8px; }
        .btn-c { background: #4a5568; border: none; color: white; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .count-num { min-width: 15px; text-align: center; font-weight: bold; }
        
        .main-btn { width: 100%; margin-top: 20px; padding: 15px; background: var(--good); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .main-btn:active { transform: scale(0.98); opacity: 0.9; }
        
        .hidden { display: none !important; }
        h2 { text-align: center; margin: 0; font-size: 20px; }
    </style>
</head>
<body>

<div class="app-card" id="setup-ui">
    <h2>🛠️ 遊戲配置</h2>
    
    <div class="setup-container">
        <div class="camp-column">
            <div class="camp-title" style="color: var(--wolf);">🐺 狼人陣營</div>
            <div id="wolf-list"></div>
        </div>
        
        <div class="camp-column">
            <div class="camp-title" style="color: var(--good);">😇 好人陣營</div>
            <div id="good-list"></div>
        </div>
    </div>

    <button class="main-btn" onclick="dealCards()">🎲 生成座位與發牌</button>
</div>

<script>
    // 角色清單
    const allRoles = {
        "狼人": "WOLF", "狼兄": "WOLF", "狼弟": "WOLF", "狼王": "WOLF", 
        "黑狼王": "WOLF", "白狼王": "WOLF", "狼美人": "WOLF", "機械狼": "WOLF", 
        "惡靈騎士": "WOLF", "種狼": "WOLF",
        "預言家": "GOOD", "女巫": "GOOD", "獵人": "GOOD", "白痴": "GOOD", 
        "守衛": "GOOD", "騎士": "GOOD", "魔術師": "GOOD", "攝夢人": "GOOD", "平民": "GOOD"
    };

    let counts = {};

    // 初始化介面
    function init() {
        const wContainer = document.getElementById('wolf-list');
        const gContainer = document.getElementById('good-list');
        
        for (let role in allRoles) {
            counts[role] = 0;
            const html = `
                <div class="role-card">
                    <span class="role-name">${role}</span>
                    <div class="counter-group">
                        <button class="btn-c" onclick="upd('${role}', -1)">-</button>
                        <span class="count-num" id="v-${role}">0</span>
                        <button class="btn-c" onclick="upd('${role}', 1)">+</button>
                    </div>
                </div>
            `;
            if (allRoles[role] === "WOLF") wContainer.innerHTML += html;
            else gContainer.innerHTML += html;
        }
    }

    function upd(role, delta) {
        counts[role] = Math.max(0, counts[role] + delta);
        document.getElementById(`v-${role}`).innerText = counts[role];
    }

    function dealCards() {
        let deck = [];
        for (let role in counts) {
            for (let i = 0; i < counts[role]; i++) deck.push(role);
        }

        if (deck.length === 0) {
            alert("請先增加角色數量！");
            return;
        }

        alert(`已選取 ${deck.length} 位角色，準備發牌！\n(請接著串接資料庫邏輯)`);
        console.log("牌堆內容:", deck);
    }

    window.onload = init;
</script>

</body>
</html>
