<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>狼人殺助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --wolf: #ef4444;
            --good: #3b82f6;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: auto;
        }

        h3 { text-align: center; font-weight: 600; letter-spacing: 1px; margin-bottom: 20px; }

        /* 配置區美化 */
        .config-box { background: rgba(0, 0, 0, 0.2); border-radius: 12px; padding: 10px; margin-bottom: 15px; }
        .camp-title { 
            font-size: 12px; font-weight: bold; text-align: center; 
            padding: 4px 0; border-radius: 6px; margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .role-row { 
            display: flex; justify-content: space-between; align-items: center; 
            margin: 6px 0; padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.03);
        }
        
        .counter { display: flex; align-items: center; gap: 10px; }
        .btn-c { 
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            transition: all 0.2s; font-size: 14px;
        }
        .btn-c:hover { background: var(--accent); }

        /* 主按鈕 */
        .btn-main { 
            background: linear-gradient(135deg, #38bdf8, #1d4ed8);
            color: white; width: 100%; padding: 16px; border-radius: 14px;
            border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); transition: transform 0.2s;
        }

        /* 座位區 */
        .seat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .seat-btn { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            height: 65px; font-size: 1.3rem; border-radius: 14px; color: var(--text);
            cursor: pointer; transition: all 0.3s;
        }
        .seat-btn.my-choice { background: var(--accent); color: var(--bg); font-weight: 800; box-shadow: 0 0 15px var(--accent); border: none; }
        .seat-btn:disabled:not(.my-choice) { opacity: 0.15; cursor: not-allowed; }

        /* 主持人專區 */
        #host-btn {
            background: transparent; color: var(--text-dim); border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%; margin-top: 20px; padding: 12px; border-radius: 12px; cursor: pointer;
        }
        #admin-reset-btn { margin-top: 30px; color: #4b5563; font-size: 11px; border: none; background: none; cursor: pointer; width: 100%; text-decoration: underline; }

        /* 彈窗 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #show-role { font-size: 2.5rem; color: #fff; margin: 15px 0; font-weight: bold; }
        #show-skill { color: #888; text-align: center; padding: 0 35px; font-size: 0.95rem; line-height: 1.6; }
        .btn-close { margin-top: 40px; padding: 12px 40px; border-radius: 30px; border: 1px solid #333; background: transparent; color: #aaa; cursor: pointer; }
        
        .host-list { width: 85%; max-height: 60vh; overflow-y: auto; }
        .host-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-card">
    <div id="setup-ui">
        <h3>配置身分</h3>
        <div style="text-align:center; margin-bottom:15px; color: var(--text-dim); font-size: 14px;">
            總人數：<input type="number" id="totalCount" value="9" style="background: rgba(0,0,0,0.3); border: 1px solid #444; color: white; width: 45px; text-align: center; border-radius: 4px;">
        </div>
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <div class="camp-title" style="background: rgba(239, 68, 68, 0.1); color: var(--wolf);">狼人陣營</div>
                <div id="wolf-list" class="config-box"></div>
            </div>
            <div style="flex:1;">
                <div class="camp-title" style="background: rgba(59, 130, 246, 0.1); color: var(--good);">好人陣營</div>
                <div id="good-list" class="config-box"></div>
            </div>
        </div>
        <button class="btn-main" onclick="dealCards()">🎲 生成座位並同步</button>
    </div>

    <div id="game-ui" class="hidden">
        <div id="status-text" style="text-align:center; color:var(--text-dim); margin-bottom: 10px; font-size: 13px;"></div>
        <div id="seat-grid" class="seat-grid"></div>
        <button id="host-btn" onclick="selectHostMode()">👁️ 主持人視角</button>
        <button id="admin-reset-btn" class="hidden" onclick="clearGameData()">重置全場遊戲 (主持人專屬)</button>
    </div>
</div>

<div id="reveal-screen" class="overlay hidden">
    <div style="font-size:12px; color:#444;">YOUR IDENTITY</div>
    <div id="show-role"></div>
    <div id="show-skill"></div>
    <button class="btn-close" onclick="closeOverlay()">我看好了</button>
</div>

<div id="host-screen" class="overlay hidden">
    <div style="font-size:14px; margin-bottom:20px; color:#555;">上帝視角 - 全場身分</div>
    <div id="host-content" class="host-list"></div>
    <button class="btn-close" onclick="closeOverlay()">返回</button>
</div>

<script>
const ROOM_ID = "302"; 
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 完整身分清單
const wolfRoles = [
    {n: "狼人", s: "夜晚可與狼隊商量擊殺一名玩家。"},
    {n: "狼王", s: "出局後可帶走一名玩家。"},
    {n: "黑狼王", s: "出局後可帶走一名玩家。"},
    {n: "白狼王", s: "白天可自爆並帶走一名玩家。"},
    {n: "狼美人", s: "出局時魅惑對象隨之殉情。"},
    {n: "機械狼", s: "可學習一名玩家技能並使用。"},
    {n: "惡靈騎士", s: "反彈技能且夜晚不死。"},
    {n: "種狼", s: "可將一名玩家感染成狼人。"}
];
const goodRoles = [
    {n: "平民", s: "無特殊技能，請認真表水。"},
    {n: "預言家", s: "每晚可查驗一名玩家的陣營。"},
    {n: "女巫", s: "擁有一瓶解藥與一瓶毒藥。"},
    {n: "獵人", s: "死後可開槍射殺一名玩家。"},
    {n: "騎士", s: "白天可決鬥，狼死或騎士死。"},
    {n: "守衛", s: "每晚可守護一人，不可連守。"},
    {n: "魔術師", s: "每晚交換兩名玩家的狀態。"},
    {n: "攝夢人", s: "每晚守護一人，連夢兩次則死。"}
];

let counts = {};
let currentDeck = [];
let userIdentity = localStorage.getItem('userIdentity'); 

function init() {
    renderList('wolf-list', wolfRoles);
    renderList('good-list', goodRoles);
    listenForGame();
}

function renderList(id, list) {
    const container = document.getElementById(id);
    list.forEach(r => {
        counts[r.n] = 0;
        const div = document.createElement('div');
        div.className = 'role-row';
        div.innerHTML = `<span style="font-size:13px">${r.n}</span><div class="counter"><button class="btn-c" onclick="upd('${r.n}',-1)">-</button><span id="v-${r.n}" style="min-width:12px;text-align:center">0</span><button class="btn-c" onclick="upd('${r.n}',1)">+</button></div>`;
        container.appendChild(div);
    });
}

function upd(n, d) { counts[n] = Math.max(0, counts[n] + d); document.getElementById('v-' + n).innerText = counts[n]; }

function dealCards() {
    const total = parseInt(document.getElementById('totalCount').value);
    let deck = [];
    for (let n in counts) { for (let i = 0; i < counts[n]; i++) deck.push(n); }
    while (deck.length < total) deck.push("平民");
    if (deck.length > total) return alert("配置超過總人數！");
    deck.sort(() => Math.random() - 0.5);
    db.ref('w_rooms/' + ROOM_ID).set({ roles: deck, timestamp: Date.now() });
}

function listenForGame() {
    db.ref('w_rooms/' + ROOM_ID).on('value', snap => {
        const data = snap.val();
        if (!data) {
            document.getElementById('setup-ui').classList.remove('hidden');
            document.getElementById('game-ui').classList.add('hidden');
            return;
        }
        const lastTime = localStorage.getItem('lastTime');
        if (lastTime && lastTime != data.timestamp) {
            localStorage.removeItem('userIdentity');
            userIdentity = null;
        }
        localStorage.setItem('lastTime', data.timestamp);
        currentDeck = data.roles;
        document.getElementById('setup-ui').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        renderUI();
    });
}

function renderUI() {
    const grid = document.getElementById('seat-grid');
    const hostBtn = document.getElementById('host-btn');
    const resetBtn = document.getElementById('admin-reset-btn');
    const statusText = document.getElementById('status-text');
    grid.innerHTML = "";

    if (userIdentity === 'HOST') {
        statusText.innerText = "⚡ 主持人上帝視角";
        resetBtn.classList.remove('hidden');
        hostBtn.innerHTML = "👁️ 查看全場清單";
        hostBtn.onclick = openHostList;
        currentDeck.forEach((_, i) => createBtn(grid, i + 1, true));
    } else if (userIdentity?.startsWith('PLAYER_')) {
        const myNum = userIdentity.split('_')[1];
        statusText.innerText = "您已鎖定 " + myNum + " 號位置";
        hostBtn.classList.add('hidden');
        resetBtn.classList.add('hidden');
        currentDeck.forEach((r, i) => createBtn(grid, i+1, (i+1)!=myNum, r));
    } else {
        statusText.innerText = "請選擇您的座號";
        resetBtn.classList.add('hidden');
        hostBtn.onclick = selectHostMode;
        currentDeck.forEach((r, i) => {
            const num = i + 1;
            const btn = document.createElement('button');
            btn.className = 'seat-btn';
            btn.innerText = num;
            btn.onclick = () => {
                if (confirm("確認領取 " + num + " 號？")) {
                    userIdentity = "PLAYER_" + num;
                    localStorage.setItem('userIdentity', userIdentity);
                    renderUI();
                    showPersonalRole(r, num);
                }
            };
            grid.appendChild(btn);
        });
    }
}

function createBtn(grid, num, dis, role = "") {
    const btn = document.createElement('button');
    btn.className = 'seat-btn';
    btn.innerText = num;
    if (dis) btn.disabled = true;
    if (userIdentity === `PLAYER_${num}`) {
        btn.classList.add('my-choice');
        btn.onclick = () => showPersonalRole(role, num);
    }
    grid.appendChild(btn);
}

function selectHostMode() {
    if (confirm("確認成為主持人？(將無法領取座號)")) {
        userIdentity = 'HOST';
        localStorage.setItem('userIdentity', userIdentity);
        renderUI();
        openHostList();
    }
}

function openHostList() {
    document.getElementById('host-content').innerHTML = currentDeck.map((r, i) => 
        `<div class="host-item"><span>${i+1} 號</span><span style="color:var(--accent)">${r}</span></div>`).join('');
    document.getElementById('host-screen').classList.remove('hidden');
}

function showPersonalRole(name, num) {
    document.getElementById('show-num').innerText = num; // Hidden container
    document.getElementById('show-role').innerText = name;
    const all = [...wolfRoles, ...goodRoles];
    document.getElementById('show-skill').innerText = all.find(x=>x.n===name)?.s || "無特殊技能，請認真表水。";
    document.getElementById('reveal-screen').classList.remove('hidden');
}

function clearGameData() {
    if (confirm("確定重製遊戲？所有人的身分將解除鎖定。")) {
        db.ref('w_rooms/' + ROOM_ID).remove();
    }
}

function closeOverlay() { document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden')); }
init();
</script>
</body>
</html>
