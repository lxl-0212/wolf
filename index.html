<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>狼人殺助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0f172a; --wolf: #ff4757; --good: #2e86de; --accent: #ffa502; --text: #f1f5f9; }
        body { font-family: sans-serif; background: #0f172a; background: radial-gradient(circle at top right, #1e293b, #0f172a); color: var(--text); margin: 0; padding: 15px; min-height: 100vh; }
        .app-card { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(15px); width: 90%; max-width: 450px; border-radius: 28px; padding: 24px; margin: 20px auto; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-top: 0; }
        .camp-section { margin-bottom: 20px; }
        .camp-title { font-size: 14px; font-weight: bold; padding: 6px 15px; border-radius: 10px; margin-bottom: 12px; display: inline-block; }
        .wolf-t { background: rgba(255, 71, 87, 0.2); color: var(--wolf); }
        .good-t { background: rgba(46, 134, 222, 0.2); color: var(--good); }
        .role-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .role-item { background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .counter-group { display: flex; align-items: center; gap: 12px; }
        .btn-count { width: 35px; height: 35px; border-radius: 8px; border: none; background: rgba(255, 255, 255, 0.1); color: white; font-size: 20px; cursor: pointer; }
        .val { min-width: 25px; text-align: center; font-weight: bold; color: var(--accent); font-size: 18px; }
        .btn-main { width: 100%; padding: 18px; margin-top: 25px; border-radius: 18px; border: none; background: linear-gradient(135deg, #2e86de, #5f27cd); color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .seat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .seat-btn { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; height: 70px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .seat-btn.my-choice { background: #000; border: 2px solid var(--accent); box-shadow: 0 0 15px var(--accent); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .card-pop { background: #fff; color: #1e293b; padding: 40px 30px; border-radius: 30px; width: 85%; max-width: 320px; text-align: center; }
        .share-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--wolf); color: white; padding: 12px 30px; border-radius: 50px; font-weight: bold; z-index: 500; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        #idle-notice { position: fixed; top: 0; width: 100%; background: var(--accent); color: #000; text-align: center; font-size: 12px; font-weight: bold; padding: 5px 0; z-index: 2000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="idle-notice" class="hidden">💤 偵測到閒置，點擊螢幕恢復連線</div>

<div class="app-card" id="setup-ui">
    <h2>🐺 狼人殺助手</h2>
    <div class="camp-section">
        <div class="camp-title wolf-t">狼人陣營</div>
        <div id="wolf-list" class="role-grid"></div>
    </div>
    <div class="camp-section">
        <div class="camp-title good-t">好人陣營</div>
        <div id="good-list" class="role-grid"></div>
    </div>
    <button class="btn-main" onclick="dealCards()">🎲 生成座位與發牌</button>
</div>

<div class="app-card hidden" id="game-ui">
    <h3 style="text-align:center">房間號：<span id="room-display" style="color:var(--accent)"></span></h3>
    <div id="seat-grid" class="seat-grid"></div>
    <button id="host-master-btn" style="width:100%; margin-top:30px; background:none; border:1px dashed #555; color:#888; padding:10px; border-radius:10px;" onclick="openHostList()">上帝全視角 (主持人)</button>
    <button onclick="location.href=location.pathname" style="width:100%; margin-top:20px; background:none; border:none; color:#666; font-size:12px;">返回首頁</button>
</div>

<div id="share-trigger" class="share-bar hidden" onclick="openShareModal()">🔗 分享與掃碼</div>

<div id="reveal-screen" class="overlay hidden">
    <div class="card-pop">
        <div id="show-role" style="font-size:2.5rem; font-weight:900; margin-bottom:10px;"></div>
        <div id="camp-tag" style="display:inline-block; padding:5px 15px; border-radius:50px; color:white; font-size:12px; margin-bottom:20px;"></div>
        <div id="show-skill" style="text-align:left; font-size:14px; line-height:1.6; border-top:1px solid #eee; padding-top:15px; color:#666;"></div>
    </div>
    <button onclick="closeOverlay()" style="margin-top:40px; background:white; color:black; border:none; padding:15px 60px; border-radius:50px; font-weight:bold;">記住了</button>
</div>

<div id="share-modal" class="overlay hidden">
    <div style="background:white; color:black; padding:30px; border-radius:30px; width:80%; max-width:320px; text-align:center;">
        <h3>掃碼加入</h3>
        <div id="qrcode" style="display:flex; justify-content:center; margin-bottom:20px;"></div>
        <button onclick="nativeShare()" style="width:100%; padding:15px; background:#e63946; color:white; border:none; border-radius:15px; font-weight:bold;">複製/分享連結</button>
        <button onclick="closeOverlay()" style="width:100%; margin-top:10px; background:none; border:none; color:#888;">關閉</button>
    </div>
</div>

<script>
// 1. 設定與角色資料
const allRoles = {
    "狼人": {c: "WOLF", s: "夜晚與狼隊商量擊殺一名玩家。"},
    "狼兄": {c: "WOLF", s: "狼兄在場時，狼隊夜晚可擊殺兩名玩家。"},
    "狼弟": {c: "WOLF", s: "狼兄出局後的當晚，狼弟狂暴。"},
    "狼王": {c: "WOLF", s: "出局後可帶一人，毒死無法發動。"},
    "黑狼王": {c: "WOLF", s: "出局後可帶走一名玩家。"},
    "白狼王": {c: "WOLF", s: "白天自爆可帶走一名玩家。"},
    "狼美人": {c: "WOLF", s: "出局魅惑對象隨之殉情。"},
    "機械狼": {c: "WOLF", s: "可學習一名玩家技能使用。"},
    "惡靈騎士": {c: "WOLF", s: "反彈夜晚受到的技能且不死。"},
    "種狼": {c: "WOLF", s: "可感染一名玩家成狼人。"},
    "預言家": {c: "GOOD", s: "每晚查驗一名玩家陣營。"},
    "女巫": {c: "GOOD", s: "擁有一瓶解藥與毒藥。不可自救。"},
    "獵人": {c: "GOOD", s: "出局後可射殺一名玩家。"},
    "白痴": {c: "GOOD", s: "被放逐免疫死亡，失去投票權。"},
    "守衛": {c: "GOOD", s: "每晚守護一人，不可連守。"},
    "騎士": {c: "GOOD", s: "白天可決鬥，翻開身分分生死。"},
    "魔術師": {c: "GOOD", s: "每晚交換兩名玩家狀態。"},
    "攝夢人": {c: "GOOD", s: "每晚守護一人，連夢兩次則死。"},
    "平民": {c: "GOOD", s: "無特殊技能，靠邏輯獲勝。"}
};
let counts = {};

// Firebase 初始化
const firebaseConfig = {
    apiKey: "AIzaSyAMkVtoNERRaeAQLkuq7F8-Z1Dnu-q4iCM",
    authDomain: "wolf-game-80e1d.firebaseapp.com",
    databaseURL: "https://wolf-game-80e1d-default-rtdb.asia-southeast1.firebasedatabase.app", 
    projectId: "wolf-game-80e1d",
    storageBucket: "wolf-game-80e1d.firebasestorage.app",
    messagingSenderId: "830974592836",
    appId: "1:830974592836:web:5f21f6a7fdd3743ed77911"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 閒置斷線邏輯
let idleTimer;
function resetIdleTimer() {
    clearTimeout(idleTimer);
    if (!db.app_.container.getProvider("database").getImmediate().repo_?.persistentConnection_?.visible_) {
        db.goOnline();
        document.getElementById('idle-notice').classList.add('hidden');
    }
    idleTimer = setTimeout(() => {
        db.goOffline();
        document.getElementById('idle-notice').classList.remove('hidden');
    }, 1800000); // 30分鐘
}
['mousedown', 'touchstart'].forEach(evt => window.addEventListener(evt, resetIdleTimer));

// 初始化角色清單
function renderRoleList() {
    const wList = document.getElementById('wolf-list');
    const gList = document.getElementById('good-list');
    Object.keys(allRoles).forEach(name => {
        counts[name] = 0;
        const html = `<div class="role-item"><span>${name}</span><div class="counter-group"><button class="btn-count" onclick="upd('${name}',-1)">-</button><span id="v-${name}" class="val">0</span><button class="btn-count" onclick="upd('${name}',1)">+</button></div></div>`;
        if (allRoles[name].c === "WOLF") wList.innerHTML += html;
        else gList.innerHTML += html;
    });
}
function upd(name, delta) { counts[name] = Math.max(0, counts[name] + delta); document.getElementById('v-' + name).innerText = counts[name]; }

// 遊戲進入/發牌邏輯
const urlParams = new URLSearchParams(window.location.search);
let ROOM_ID = urlParams.get('room');
let userIdentity = localStorage.getItem('userIdentity_' + ROOM_ID);

window.onload = () => {
    renderRoleList();
    if (ROOM_ID) {
        document.getElementById('setup-ui').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        document.getElementById('share-trigger').classList.remove('hidden');
        document.getElementById('room-display').innerText = ROOM_ID;
        db.ref('w_rooms/' + ROOM_ID).on('value', snap => {
            const data = snap.val();
            if (data) renderSeats(data.roles, data.deaths);
        });
    }
    resetIdleTimer();
};

function dealCards() {
    let deck = [];
    for (let n in counts) { for (let i = 0; i < counts[n]; i++) deck.push(n); }
    if (deck.length === 0) return alert("請先選取角色！");
    deck.sort(() => Math.random() - 0.5);
    const newID = "R" + Math.floor(100000 + Math.random() * 900000);
    db.ref('w_rooms/' + newID).set({ roles: deck, deaths: new Array(deck.length).fill(false), timestamp: Date.now() })
      .then(() => { window.location.search = '?room=' + newID; });
}

function renderSeats(roles, deaths) {
    const grid = document.getElementById('seat-grid');
    grid.innerHTML = "";
    if (userIdentity) document.getElementById('host-master-btn').classList.add('hidden');
    roles.forEach((r, i) => {
        const btn = document.createElement('button');
        btn.className = 'seat-btn';
        if (userIdentity === `P_${i}`) {
            btn.classList.add('my-choice');
            btn.innerText = `${i+1} 號 (我)`;
            btn.onclick = () => showCard(r);
        } else if (userIdentity) {
            btn.innerText = `${i+1} 號`;
            btn.disabled = true;
            btn.style.opacity = deaths[i] ? "0.3" : "1";
        } else {
            btn.innerText = `${i+1} 號`;
            btn.onclick = () => { if(confirm(`鎖定 ${i+1} 號？`)) { userIdentity=`P_${i}`; localStorage.setItem('userIdentity_' + ROOM_ID, userIdentity); renderSeats(roles, deaths); showCard(r); }};
        }
        grid.appendChild(btn);
    });
}

function showCard(name) {
    const data = allRoles[name];
    document.getElementById('show-role').innerText = name;
    document.getElementById('show-role').style.color = data.c === "WOLF" ? "#ff4757" : "#2e86de";
    document.getElementById('camp-tag').innerText = data.c === "WOLF" ? "狼人陣營" : "好人陣營";
    document.getElementById('camp-tag').style.background = data.c === "WOLF" ? "#ff4757" : "#2e86de";
    document.getElementById('show-skill').innerText = data.s;
    document.getElementById('reveal-screen').classList.remove('hidden');
}

function openShareModal() {
    document.getElementById('share-modal').classList.remove('hidden');
    const qrDiv = document.getElementById('qrcode');
    qrDiv.innerHTML = "";
    new QRCode(qrDiv, { text: window.location.href, width: 160, height: 160 });
}

function nativeShare() {
    if(navigator.share) navigator.share({title:'狼人殺助手', url:window.location.href});
    else { navigator.clipboard.writeText(window.location.href); alert("網址已複製到剪貼簿！"); }
}

function closeOverlay() { document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden')); }
</script>
</body>
</html>
